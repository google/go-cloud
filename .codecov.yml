codecov:
  # Set via secrets, see .github/workflows/tests.yml.
  token: ""
ignore:
  - "**/drivertest/*.go"
  - "samples"
  - "internal/setup"
  - "internal/releasehelper"
  - "internal/testing/setup"
  - "internal/testing/terraform"
  - "internal/website"
coverage:
  status:
    project:
      default:
        target: 0
        threshold: null
        base: auto
    patch:
      default:
        target: 0
        threshold: null
        base: auto
